name: Teams app package

# Builds the zip to upload in Teams. Uploading stays a manual step, see doc/setup.md step 6.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - teams/**
      - .github/workflows/teams-app.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build package
        id: package
        env:
          TEAMS_APP_ID: ${{ vars.TEAMS_APP_ID }}
          BOT_CLIENT_ID: ${{ vars.BOT_CLIENT_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: pnpm build:teams-package
      # Uploaded as the zip itself, named after the file, so it downloads ready to upload to Teams.
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.package }}
          archive: false
