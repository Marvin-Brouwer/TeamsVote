name: Publish web app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/web/**
      - src/api/src/contracts/**
      - doc/privacy-policy.md
      - doc/tos.md
      - pnpm-lock.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

# One deploy at a time. Don't cancel a running one, a half-finished upload is worse than a late one.
concurrency:
  group: web-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '[dispatch]' || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          VITE_API_URL: ${{ vars.API_URL }}
        run: pnpm --filter @teams-vote/web build
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: ./src/web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # The environment-scoped OIDC subject (repo:…:environment:production) is what the federated credential trusts.
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    permissions:
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: ./dist
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get deployment token
        id: swa-token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: ./dist
          skip_app_build: true
          skip_api_build: true
