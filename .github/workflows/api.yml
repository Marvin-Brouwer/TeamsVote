name: Publish API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/api/**
      - pnpm-lock.yaml
      - .github/workflows/api.yml

permissions:
  contents: read

# One deploy at a time. Don't cancel a running one, a half-finished upload is worse than a late one.
concurrency:
  group: api-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '[dispatch]' || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm exec eslint src/api
      - name: Typecheck
        run: pnpm --filter @t-vote/api typecheck
      - name: Test
        run: pnpm exec vitest run --project api
      - name: Build
        run: pnpm --filter @t-vote/api build
      # The built server plus its production dependencies. A flat node_modules, because zip deploys don't keep
      # the symlinks pnpm normally uses. App Service starts it with `node dist/server.mjs`, see infra/modules/api.bicep.
      - name: Package
        run: |
          pnpm --filter @t-vote/api --config.node-linker=hoisted deploy --prod --legacy package
          cd package
          zip -qr ../api.zip dist node_modules package.json -x 'node_modules/.bin/*'
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: api
          path: api.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # The environment-scoped OIDC subject (repo:…:environment:production) is what the federated credential trusts.
    environment:
      name: production
      url: https://${{ vars.AZURE_API_APP_NAME }}.azurewebsites.net/health
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v5
        with:
          name: api
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          package: api.zip
