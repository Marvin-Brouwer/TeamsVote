name: Publish `teams-vote-api`

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Only publish when the example changes
      - src/teams-vote-api/**
      - .github/workflows/teams-vote-api.yml

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  # Make the group unique, but, distinguish between automatic and manual dispatch
  group: render-api-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '[dispatch]' || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5 
        with:
          lfs: true
      # Supposedly this speeds up the build
      # https://github.com/actions/setup-node/issues/819#issuecomment-1659698335
      - uses: actions/cache@v4
        with:
          path: '~/.pnpm'
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          check-latest: true
      - name: Install dependencies
        run: pnpm install
        working-directory: '.'
      - name: Build dependencies
        run: pnpm deploy:build
        working-directory: '.'
      - name: Build app
        env: 
          VITE_UI_APP_URL: ${{ vars.TEAMS_UI_URL }}
          TEAMS_PLUGIN_TENANT_ID: ${{ secrets.TEAMS_PLUGIN_TENANT_ID }}
          TEAMS_CHATBOT_CLIENT_ID: ${{ secrets.TEAMS_CHATBOT_CLIENT_ID }}
          TEAMS_CHATBOT_CLIENT_SECRET: ${{ secrets.TEAMS_CHATBOT_CLIENT_SECRET }}
        run: pnpm build
        working-directory: './src/teams-vote-api'
        # TODO run tests
  deploy:
    needs: build
    environment:
      name: render-api
      url: https://teamsvote.onrender.com
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued/running deploys
        run: |
          SERVICE_ID=${{ vars.RENDER_SERVICE_ID }}
          API_KEY=${{ secrets.RENDER_API_KEY }}

          echo "Checking for queued/running deploys..."
          deploys=$(curl -s -H "Authorization: Bearer $API_KEY" \
                        -H "Accept: application/json" \
                        https://api.render.com/v1/services/$SERVICE_ID/deploys)

          deploy_id=$(echo "$deploys" | jq -r '.[] | select(.status=="queued" or .status=="deploying") | .id' | head -n1)

          if [ -n "$deploy_id" ]; then
            echo "Canceling deploy $deploy_id"
            curl -X POST -H "Authorization: Bearer $API_KEY" \
                 -H "Accept: application/json" \
                 https://api.render.com/v1/deploys/$deploy_id/cancel
          else
            echo "No queued or running deploys found"
          fi

      - name: Start Render Deploy
        id: trigger
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            https://api.render.com/v1/services/${{ vars.RENDER_SERVICE_ID }}/deploys)

          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$CODE" -ne 201 ]; then
            echo "Render deploy trigger failed (HTTP $CODE) $BODY"
            exit 1
          fi

          DEPLOY_ID=$(echo "$BODY" | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          
          # Echo link for visibility
          echo "View on render: https://dashboard.render.com/web/${{ vars.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID"

      - name: Wait For Deploy
        run: |
          DEPLOY_ID=${{ steps.trigger.outputs.deploy_id }}
          URL="https://dashboard.render.com/deploys/$DEPLOY_ID"
          echo "Following deploy: $URL"

          for i in {1..60}; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Accept: application/json" \
              https://api.render.com/v1/deploys/$DEPLOY_ID | jq -r '.status')

            echo "Deploy status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deployment succeeded: $URL"
              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo "Deployment failed: $URL"
              exit 1
            fi

            sleep 5
          done

          echo "Timeout waiting for deploy: $URL"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          DEPLOY_ID=${{ steps.trigger.outputs.deploy_id }}
          echo "### Render Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- [Deploy details](https://dashboard.render.com/web/${{ vars.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID)" >> $GITHUB_STEP_SUMMARY
