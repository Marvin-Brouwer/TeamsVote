<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Signing you in…</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <!-- purely visual -->
  <iframe src="/TeamsVote/teams/spinner/" title="Signing you in"></iframe>

  <script type="module">
    import "https://res.cdn.office.net/teams-js/2.47.2/js/MicrosoftTeams.min.js"
    try {
      await microsoftTeams.app.initialize();
      microsoftTeams.authentication.notifySuccess();
    } catch (e) {
      microsoftTeams.authentication.notifyFailure("Auth failed");
    }
  </script>
</body>

</html>
